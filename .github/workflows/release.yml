name: Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (for example: v0.2.0b2)"
        required: true
        type: string
      dry_run:
        description: "Run EVERYTHING (gates, build, production signing, verification under the production trust profile, release-notes check) but publish nothing: no tag, no release, no assets, no Discord post, no uploaded artifacts. Use on the exact release commit as a pre-flight; the real release is the same dispatch with this off."
        required: false
        type: boolean
        default: false
      seamless_eligible:
        description: "Signed in the update manifest. Set false to keep THIS release on the manual path even for supporters (e.g. a risky layout change). Never gates security fixes for free users."
        required: false
        type: boolean
        default: true

# Keep the repository default token read-only.  This workflow needs write access
# only to create the new tag and its published release after all checks succeed.
permissions:
  contents: write

# Two release / signing runs must never race over the same repository state. A run that is already publishing is never cancelled:
# cancelling between tag creation and asset upload could leave a partial release.
concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    environment: production-release
    steps:
      - name: Reject dispatches outside main
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw 'Releases may only be created from main.'
          }

      - name: Check out the exact workflow commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          # No step below needs the checkout's git credential: the only GitHub API/release steps pass GH_TOKEN explicitly.
          persist-credentials: false

      - name: Set up the pinned release Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version-file: .python-version

      - name: Release inputs are reproducible and secret-free (static, offline)
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}\src
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/lock_release_deps.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Release dependency lock drifted from packaging/requirements-release.txt.' }
          python scripts/generate_packaging_version_info.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Windows version resources are stale.' }
          python -m exilelens.ops.leak_scan source .
          if ($LASTEXITCODE -ne 0) { throw 'Source secret scan found committed credential-like material (categories above, values never printed).' }

      - name: Validate release request and existing remote state
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_VERSION -notmatch '^v\d+\.\d+\.\d+(b\d+)?$') {
            throw "Version must use the ExileLens release format, for example v0.2.0b2: $env:RELEASE_VERSION"
          }
          $remoteTag = & git ls-remote --exit-code --tags origin "refs/tags/$env:RELEASE_VERSION" 2>$null
          $tagExitCode = $LASTEXITCODE
          if ($tagExitCode -eq 0) {
            throw "Remote tag already exists and will not be reused: $env:RELEASE_VERSION"
          }
          if ($tagExitCode -ne 2) {
            throw "Could not check whether remote tag exists: $env:RELEASE_VERSION"
          }
          $releaseResult = & gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_VERSION" 2>&1
          $releaseExitCode = $LASTEXITCODE
          if ($releaseExitCode -eq 0) {
            throw "A release already exists for tag $env:RELEASE_VERSION and will not be reused."
          }
          if (($releaseResult -join "`n") -notmatch '404') {
            throw "Could not check whether a release exists for $env:RELEASE_VERSION: $($releaseResult -join ' ')"
          }
          Write-Host "Tag and release are available: $env:RELEASE_VERSION"
          # The non-zero gh exit code is expected for a missing release; clear it so the pwsh wrapper passes.
          $global:LASTEXITCODE = 0

      - name: Run source release gate
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}\src
        run: python -m exilelens.ops.cli release-gate

      - name: Install mandatory release-test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pytest PySide6 "cryptography==50.0.0"

      - name: Run mandatory release regressions
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}\src
        run: python -m exilelens.ops.cli release-regressions

      - name: Apply explicit cloud service configuration
        shell: pwsh
        env:
          EXILELENS_CLOUD_API_URL: ${{ vars.EXILELENS_CLOUD_API_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "$env:EXILELENS_CLOUD_API_URL".Trim()
          if (-not $url) {
            Write-Host 'No EXILELENS_CLOUD_API_URL variable: cloud features stay OFF in this release.'
          }
          else {
            if ($url -notmatch '^https://[A-Za-z0-9.-]+(:[0-9]+)?/?$' -or $url -match '(?i)\.workers\.dev') {
              throw 'EXILELENS_CLOUD_API_URL must be an https origin on the production API domain (not *.workers.dev).'
            }
            $path = Join-Path $env:GITHUB_WORKSPACE 'src\exilelens\cloud\release_config.json'
            $json = (@{ schema = 1; api_base_url = $url.TrimEnd('/') } | ConvertTo-Json -Compress)
            [System.IO.File]::WriteAllText($path, $json, [System.Text.UTF8Encoding]::new($false))
            Write-Host "Cloud features configured for release against $($url.TrimEnd('/'))"
          }
      # build_exe.ps1 builds the updater exactly once (before provenance is recorded) and stages that exact binary; there is no
      # second updater build step.
      - name: Build the official Windows onedir distribution
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build_exe.ps1 -SkipShortcut

      - name: Run packaged-artifact release gate
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}\src
        run: python -m exilelens.ops.cli release-gate --require-artifact

      - name: Materialize production update signing key
        shell: pwsh
        env:
          EXILELENS_UPDATE_SIGNING_KEY_B64: ${{ secrets.EXILELENS_UPDATE_SIGNING_KEY_B64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\materialize_update_signing_key.ps1

      - name: Require production update signing key
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = $env:EXILELENS_UPDATE_SIGNING_KEY_PATH
          if ([string]::IsNullOrWhiteSpace($path) -or -not (Test-Path -LiteralPath $path -PathType Leaf)) {
            throw 'Production release requires EXILELENS_UPDATE_SIGNING_KEY_B64 on the production-release environment.'
          }
          if ($path -match 'test_signing_key') {
            throw 'Production release must not use the test signing key.'
          }

      - name: Package and verify release assets
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SEAMLESS_ELIGIBLE: ${{ inputs.seamless_eligible }}
          PYTHONPATH: ${{ github.workspace }}\src
        run: |
          $ErrorActionPreference = 'Stop'
          $distDir = Join-Path $env:GITHUB_WORKSPACE 'dist\ExileLens'
          $exePath = Join-Path $distDir 'ExileLens.exe'
          $expectedSourceVersion = $env:RELEASE_VERSION.Substring(1)
          $sourceVersion = (& .\.release-venv\Scripts\python.exe -c "from exilelens._version import __version__; print(__version__)").Trim()
          if ($LASTEXITCODE -ne 0 -or $sourceVersion -ne $expectedSourceVersion) {
            throw "Requested tag $env:RELEASE_VERSION does not match the checked-out source version v$sourceVersion."
          }
          if (-not (Test-Path -LiteralPath $exePath -PathType Leaf)) {
            throw "Expected packaged executable is missing: $exePath"
          }
          $updaterPath = Join-Path $distDir '_internal\ExileLensUpdater.exe'
          if (-not (Test-Path -LiteralPath $updaterPath -PathType Leaf)) {
            throw "Expected packaged updater is missing: $updaterPath"
          }
          $stampPath = Join-Path $distDir 'build_stamp.json'
          if (-not (Test-Path -LiteralPath $stampPath -PathType Leaf)) {
            throw "Expected build provenance stamp is missing: $stampPath"
          }

          $archiveName = "ExileLens-$env:RELEASE_VERSION-win64.zip"
          $archivePath = Join-Path $env:RUNNER_TEMP $archiveName
          $sumsPath = Join-Path $env:RUNNER_TEMP 'SHA256SUMS.txt'
          if (Test-Path -LiteralPath $archivePath) { Remove-Item -LiteralPath $archivePath -Force }
          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'dist')
          try {
            Compress-Archive -LiteralPath 'ExileLens' -DestinationPath $archivePath -CompressionLevel Optimal
          }
          finally {
            Pop-Location
          }
          if (-not (Test-Path -LiteralPath $archivePath -PathType Leaf) -or (Get-Item -LiteralPath $archivePath).Length -eq 0) {
            throw "Release ZIP is missing or empty: $archivePath"
          }

          $hash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $sumLine = "$hash  $archiveName"
          [System.IO.File]::WriteAllText($sumsPath, "$sumLine`n", [System.Text.UTF8Encoding]::new($false))
          if (-not (Test-Path -LiteralPath $sumsPath -PathType Leaf) -or (Get-Item -LiteralPath $sumsPath).Length -eq 0) {
            throw "SHA256SUMS.txt is missing or empty: $sumsPath"
          }
          $verifiedHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $writtenLine = [System.IO.File]::ReadAllText($sumsPath, [System.Text.UTF8Encoding]::new($false)).TrimEnd("`r", "`n")
          if ($verifiedHash -ne $hash -or $writtenLine -ne $sumLine) {
            throw 'SHA256SUMS.txt does not verify the exact release ZIP.'
          }
          Write-Host $sumLine
          "ARCHIVE_PATH=$archivePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SUMS_PATH=$sumsPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $manifestName = "ExileLens-$env:RELEASE_VERSION-win64.update.json"
          $manifestPath = Join-Path $env:RUNNER_TEMP 'unsigned-manifest.json'
          $signedManifestPath = Join-Path $env:RUNNER_TEMP $manifestName
          $channel = if ($expectedSourceVersion -match 'b\d+$') { 'beta' } else { 'stable' }
          $downloadUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_VERSION/$archiveName"
          $unsigned = @{
            schema = 1
            channel = $channel
            version = $expectedSourceVersion
            tag = $env:RELEASE_VERSION
            signing_key_id = 'exilelens-prod-1'
            seamless_eligible = ($env:SEAMLESS_ELIGIBLE -ne 'false')
            artifact = @{
              filename = $archiveName
              size = (Get-Item -LiteralPath $archivePath).Length
              sha256 = $hash
              url = $downloadUrl
            }
          }
          $unsigned | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $manifestPath -Encoding utf8
          $signingKeyPath = $env:EXILELENS_UPDATE_SIGNING_KEY_PATH
          if ([string]::IsNullOrWhiteSpace($signingKeyPath) -or -not (Test-Path -LiteralPath $signingKeyPath -PathType Leaf)) {
            throw 'Production update signing key path is missing; release cannot publish test-signed metadata.'
          }
          if ($signingKeyPath -match 'test_signing_key') {
            throw 'Production release must not sign update metadata with the test key.'
          }
          & .\.release-venv\Scripts\python.exe .\scripts\sign_update_manifest.py `
            --manifest $manifestPath `
            --private-key $signingKeyPath `
            --output $signedManifestPath
          if ($LASTEXITCODE -ne 0) { throw 'Signed update manifest generation failed.' }
          # Verify exactly as a shipped client would: production trust profile only, plus tag/version/URL binding.
          & .\.release-venv\Scripts\python.exe .\scripts\verify_signed_update_manifest.py $signedManifestPath `
            --trust-profile production `
            --expect-tag $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Signed update manifest does not verify under the production trust profile.' }
          "UPDATE_MANIFEST_PATH=$signedManifestPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Remove production update signing key material
        if: ${{ always() }}
        shell: pwsh
        run: |
          $path = $env:EXILELENS_UPDATE_SIGNING_KEY_PATH
          if (-not [string]::IsNullOrWhiteSpace($path) -and (Test-Path -LiteralPath $path)) {
            Remove-Item -LiteralPath $path -Force
          }
          "EXILELENS_UPDATE_SIGNING_KEY_PATH=" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Leak scan the package directory and the final ZIP
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}\src
        run: |
          $ErrorActionPreference = 'Stop'
          python -m exilelens.ops.leak_scan package dist\ExileLens --zip $env:ARCHIVE_PATH --literal $env:GITHUB_WORKSPACE --literal $env:USERPROFILE
          if ($LASTEXITCODE -ne 0) { throw 'Release package leak scan failed (categories and counts only above).' }

      - name: Validate official release notes
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $notesPath = Join-Path $env:GITHUB_WORKSPACE 'packaging\RELEASE_NOTES.md'
          if (-not (Test-Path -LiteralPath $notesPath -PathType Leaf)) {
            throw "Official release notes are missing: packaging/RELEASE_NOTES.md"
          }
          $expectedTag = $env:RELEASE_VERSION.Trim()
          $expectedVersion = $expectedTag.Substring(1)
          $heading = (Get-Content -LiteralPath $notesPath -TotalCount 1 -Encoding utf8).Trim()
          if ($heading -notmatch "^#\s+ExileLens\s+$expectedVersion\b") {
            throw "Release notes heading must be '# ExileLens $expectedVersion' for tag $expectedTag; got: $heading"
          }
          if ((Get-Item -LiteralPath $notesPath).Length -eq 0) {
            throw 'Official release notes file is empty.'
          }
          "RELEASE_NOTES_PATH=$notesPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Dry run summary (nothing is published)
        if: ${{ inputs.dry_run }}
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "::notice::DRY RUN for $env:RELEASE_VERSION - nothing was published; the production-signed manifest below verified under the production trust profile."
          Get-Content -LiteralPath $env:SUMS_PATH
          Get-Content -LiteralPath $env:UPDATE_MANIFEST_PATH -Raw

      - name: Create published release
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = (git rev-parse HEAD).Trim()
          if ($commit -notmatch '^[0-9a-f]{40}$') { throw 'Could not determine the exact checked-out commit.' }
          # The title follows the version, like the manifest channel: a beta version (bN suffix) is titled "- Beta", a stable one is not.
          $releaseTitle = if ($env:RELEASE_VERSION -match 'b\d+$') { "ExileLens $env:RELEASE_VERSION - Beta" } else { "ExileLens $env:RELEASE_VERSION" }
          & gh release create $env:RELEASE_VERSION $env:ARCHIVE_PATH $env:SUMS_PATH $env:UPDATE_MANIFEST_PATH `
            --target $commit `
            --title $releaseTitle `
            --latest `
            --notes-file $env:RELEASE_NOTES_PATH
          if ($LASTEXITCODE -ne 0) { throw 'GitHub CLI failed to create the release.' }

      - name: Build Discord release announcement
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $payloadPath = Join-Path $env:RUNNER_TEMP 'discord-release-announcement.json'
            & .\.release-venv\Scripts\python.exe .\scripts\discord_release_announcement.py `
              --version $env:RELEASE_VERSION `
              --changelog .\packaging\CHANGELOG.txt `
              --output $payloadPath
            if ($LASTEXITCODE -ne 0) { throw 'Could not build the Discord announcement payload.' }
            "DISCORD_PAYLOAD_PATH=$payloadPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          catch {
            Write-Warning 'Discord release announcement could not be prepared; the release remains published.'
          }

      - name: Announce published release on Discord
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DISCORD_RELEASE_WEBHOOK)) {
            Write-Warning 'Discord release announcement skipped: DISCORD_RELEASE_WEBHOOK is not configured.'
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:DISCORD_PAYLOAD_PATH) -or -not (Test-Path -LiteralPath $env:DISCORD_PAYLOAD_PATH -PathType Leaf)) {
            Write-Warning 'Discord release announcement skipped because its payload was unavailable; the release remains published.'
            exit 0
          }
          try {
            & curl.exe --fail --silent --show-error --request POST `
              --header 'Content-Type: application/json' `
              --data-binary "@$env:DISCORD_PAYLOAD_PATH" `
              $env:DISCORD_RELEASE_WEBHOOK
            if ($LASTEXITCODE -ne 0) { throw 'Discord webhook returned a failure status.' }
          }
          catch {
            Write-Warning 'Discord release announcement failed after GitHub Release publication; the release remains published.'
          }
