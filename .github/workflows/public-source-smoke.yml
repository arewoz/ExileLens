name: Public source smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install pytest PySide6 ruff
      - run: python -m exilelens.ops.startup_static_check
        env:
          PYTHONPATH: ${{ github.workspace }}\src
      - run: python -m pytest -q -o addopts= public_tests tests/test_application_startup_composition.py
        env:
          PYTHONPATH: ${{ github.workspace }}\src
