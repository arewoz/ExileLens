name: Validate update signing (no publish)

on:
  workflow_dispatch:
    inputs:
      use_production_secret:
        description: "When true, require EXILELENS_UPDATE_SIGNING_KEY_B64 from the protected environment"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: update-signing-validation
  cancel-in-progress: false

jobs:
  # Test-key pipeline self-check. No environment, so no production secret can be exposed to this job at all.
  validate-test-signing:
    if: ${{ !inputs.use_production_secret }}
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version-file: .python-version

      - name: Install signing dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check "cryptography==50.0.0"

      - name: Sign and verify sample update manifest with the TEST key
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}\src
        run: |
          $ErrorActionPreference = 'Stop'
          $keyPath = Join-Path $env:GITHUB_WORKSPACE 'fixtures/update_signing/test_signing_key.pem'
          $unsigned = @{
            schema = 1
            channel = 'beta'
            version = '0.0.0-signing-check'
            tag = 'v0.0.0-signing-check'
            signing_key_id = 'exilelens-test-1'
            artifact = @{
              filename = 'ExileLens-v0.0.0-signing-check-win64.zip'
              size = 4
              sha256 = ('0' * 64)
              url = 'https://example.invalid/release.zip'
            }
          }
          $manifestPath = Join-Path $env:RUNNER_TEMP 'unsigned-manifest.json'
          $signedPath = Join-Path $env:RUNNER_TEMP 'signed-manifest.json'
          $unsigned | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $manifestPath -Encoding utf8
          python .\scripts\sign_update_manifest.py --manifest $manifestPath --private-key $keyPath --output $signedPath
          if ($LASTEXITCODE -ne 0) { throw 'sign_update_manifest.py failed.' }
          # Pipeline self-check only: shipped builds never trust the public test key.
          Write-Host '::notice::Test-key signing pipeline check only - NOT evidence of production update trust.'
          python .\scripts\verify_signed_update_manifest.py $signedPath --trust-profile test
          if ($LASTEXITCODE -ne 0) { throw 'Manifest verification (test profile) failed.' }
          python .\scripts\verify_signed_update_manifest.py $signedPath --trust-profile production
          if ($LASTEXITCODE -eq 0) { throw 'Production trust profile accepted a test-signed manifest.' }

  # Production-key validation: only from main, only inside the reviewer-gated environment, and only when explicitly requested.
  validate-production-signing:
    if: ${{ inputs.use_production_secret && github.ref == 'refs/heads/main' }}
    runs-on: windows-latest
    environment: production-release
    steps:
      - name: Reject dispatches outside main
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Production signing validation may only run from main.' }

      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version-file: .python-version

      - name: Install signing dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check "cryptography==50.0.0"

      - name: Materialize signing key from secret
        shell: pwsh
        env:
          EXILELENS_UPDATE_SIGNING_KEY_B64: ${{ secrets.EXILELENS_UPDATE_SIGNING_KEY_B64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:EXILELENS_UPDATE_SIGNING_KEY_B64)) {
            throw 'EXILELENS_UPDATE_SIGNING_KEY_B64 is not configured on production-release.'
          }
          & powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\materialize_update_signing_key.ps1
          if ([string]::IsNullOrWhiteSpace($env:EXILELENS_UPDATE_SIGNING_KEY_PATH)) {
            throw 'The production signing key was not materialized.'
          }

      - name: Sign and verify sample update manifest with the production key
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}\src
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EXILELENS_UPDATE_SIGNING_KEY_PATH -match 'test_signing_key') { throw 'The test key must not be used here.' }
          $unsigned = @{
            schema = 1
            channel = 'beta'
            version = '0.0.0-signing-check'
            tag = 'v0.0.0-signing-check'
            signing_key_id = 'exilelens-prod-1'
            artifact = @{
              filename = 'ExileLens-v0.0.0-signing-check-win64.zip'
              size = 4
              sha256 = ('0' * 64)
              url = 'https://example.invalid/release.zip'
            }
          }
          $manifestPath = Join-Path $env:RUNNER_TEMP 'unsigned-manifest.json'
          $signedPath = Join-Path $env:RUNNER_TEMP 'signed-manifest.json'
          $unsigned | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $manifestPath -Encoding utf8
          python .\scripts\sign_update_manifest.py --manifest $manifestPath --private-key $env:EXILELENS_UPDATE_SIGNING_KEY_PATH --output $signedPath
          if ($LASTEXITCODE -ne 0) { throw 'sign_update_manifest.py failed.' }
          python .\scripts\verify_signed_update_manifest.py $signedPath --trust-profile production
          if ($LASTEXITCODE -ne 0) { throw 'Manifest verification (production profile) failed.' }

      - name: Remove production update signing key material
        if: ${{ always() }}
        shell: pwsh
        run: |
          $path = $env:EXILELENS_UPDATE_SIGNING_KEY_PATH
          if (-not [string]::IsNullOrWhiteSpace($path) -and (Test-Path -LiteralPath $path)) {
            Remove-Item -LiteralPath $path -Force
          }
